server:
  # auth-service uses 8080, mt-member-group-ws 8082
  port: ${SERVER_PORT:8081}
  shutdown: graceful

# MUST be the same value as auth-service (HS256 shared secret)
jwt:
  secret: ${JWT_SECRET:HRdiJ624Je8Zq2o4/aLvFzAB2rqa8gzdoFb0kLZeo3GOt59akrvUtv8YGVr/kwDK}

spring:
  application:
    name: tenant-service

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:platform_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      pool-name: tenant-service-pool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # IMPORTANT: connections are schema-switched at checkout/checkin time by
      # MultiTenantConnectionProviderImpl. auto-commit stays true; schema is reset
      # on release so no tenant state leaks back into the pool.

  jpa:
    open-in-view: false
    hibernate:
      # Tenant tables are owned by Flyway, not Hibernate. This must never be
      # create/create-drop/update in any environment.
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
        # Multi-tenant connection provider / tenant identifier resolver beans are
        # registered programmatically in MultiTenancyConfig (HibernatePropertiesCustomizer),
        # which is the supported Hibernate 6 / Spring Boot 3 mechanism.

  flyway:
    enabled: true
    # Only the PLATFORM migrations run automatically on startup. Tenant schema
    # migrations are triggered on-demand by TenantSchemaProvisioner using a
    # separately-configured, in-code Flyway instance (see below).
    locations: classpath:db/migration/platform
    schemas: platform
    default-schema: platform
    create-schemas: true
    baseline-on-migrate: true

tenant:
  provisioning:
    migration-locations: classpath:db/migration/tenant
    schema-prefix: "tenant_"
    max-schema-name-length: 63

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.example.tenantservice: INFO
    org.hibernate.SQL: WARN
